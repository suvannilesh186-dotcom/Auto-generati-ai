<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGC.AI - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h1>AGC.AI</h1>
        <p>अपने डैशबोर्ड में प्रवेश करने के लिए साइन इन करें</p>
        
        <!-- डायरेक्ट onclick के साथ अपडेटेड बटन -->
        <button id="google-login-btn" onclick="handleLoginDirect()">
            <img src="google-icon.svg" style="pointer-events: none;" alt="Google"> Sign in with Google
        </button>
        
        <div id="error-display" class="error-text"></div>
    </div>

    <script type="module" src="JavaScript.js"></script>
</body>
</html>
