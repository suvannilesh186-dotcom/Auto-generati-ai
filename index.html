<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGC.AI - Secure Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-logo">AGC<span>.AI</span> CORE</div>
        <div class="login-subtitle">Connect with your Google account to continue</div>
        
        <button class="google-signin-btn" id="loginBtn">
            Sign in with Google
        </button>

        <div class="login-footer">
            Powered by <a href="#">AGC.AI</a>
        </div>
    </div>

    <!-- Firebase Login Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { CONFIG } from './config.js';

        let app, auth, googleProvider;
        try {
            const firebaseConfig = {
                apiKey: CONFIG.firebaseApiKey,
                authDomain: CONFIG.authDomain,
                projectId: CONFIG.projectId,
                storageBucket: CONFIG.storageBucket,
                messagingSenderId: CONFIG.messagingSenderId,
                appId: CONFIG.appId,
                measurementId: CONFIG.measurementId
            };
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            googleProvider = new GoogleAuthProvider();
            googleProvider.setCustomParameters({ prompt: 'select_account' });
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        const loginBtn = document.getElementById('loginBtn');
        if (loginBtn) {
            loginBtn.addEventListener('click', async () => {
                try {
                    const result = await signInWithPopup(auth, googleProvider);
                    const credential = GoogleAuthProvider.credentialFromResult(result);
                    if (credential && credential.accessToken) {
                        localStorage.setItem('agc_access_token', credential.accessToken);
                        window.location.href = 'dashboard.html';
                    }
                } catch (error) {
                    try {
                        await signInWithRedirect(auth, googleProvider);
                    } catch (redirectError) {
                        console.error("Redirect Error:", redirectError);
                    }
                }
            });
        }
    </script>
</body>
</html>
