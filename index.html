<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGC.AI - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">AGC.AI</div>
        <div class="login-message">Welcome to AGC.AI Automation</div>
        <div class="connect-message">Connect with your Google account to continue</div>
        
        <button class="signin-button" onclick="handleLoginDirect()">Sign in with Google</button>
        
        <div class="footer">
            Powered by <a href="#">AGC.AI</a>
        </div>
    </div>

    <!-- Firebase Login Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { CONFIG } from './config.js';

        let app, auth, googleProvider;

        try {
            const firebaseConfig = {
                apiKey: CONFIG.firebaseApiKey,
                authDomain: CONFIG.authDomain,
                projectId: CONFIG.projectId,
                storageBucket: CONFIG.storageBucket,
                messagingSenderId: CONFIG.messagingSenderId,
                appId: CONFIG.appId,
                measurementId: CONFIG.measurementId
            };

            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            googleProvider = new GoogleAuthProvider();
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        window.handleLoginDirect = async function() {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                const credential = GoogleAuthProvider.credentialFromResult(result);
                if (credential) {
                    const accessToken = credential.accessToken;
                    localStorage.setItem('agc_access_token', accessToken);
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                console.warn("Popup failed, trying redirect...", error);
                try {
                    await signInWithRedirect(auth, googleProvider);
                } catch (redirectError) {
                    console.error("Redirect Login Error:", redirectError);
                    alert("Login Failed: " + redirectError.message);
                }
            }
        };
    </script>
</body>
</html>
