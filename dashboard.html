<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGC.AI - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <!-- Top Header -->
    <header class="top-header">
        <button class="menu-toggle-btn" id="menuToggleBtn">☰</button>
        <div class="header-logo">AGC.AI Dashboard</div>
    </header>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="profile-box">
                <img id="channel-logo" src="https://via.placeholder.com/50" alt="Channel Logo" class="profile-logo">
                <div class="profile-info">
                    <h4 id="channel-name">Loading Channel...</h4>
                    <span id="user-email">user@gmail.com</span>
                </div>
            </div>

            <!-- Home, Analytics, Settings options removed as requested -->

            <div class="sidebar-bottom">
                <button class="switch-channel-btn" id="switchChannelBtn">🔄 Switch Channel</button>
                <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <h1>Welcome to AGC.AI!</h1>
            <p>यहाँ आपका मुख्य डैशबोर्ड कंटेंट दिखाई देगा।</p>
        </main>
    </div>

    <!-- Firebase & Dashboard Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { CONFIG } from './config.js';

        let auth;

        try {
            const firebaseConfig = {
                apiKey: CONFIG.firebaseApiKey,
                authDomain: CONFIG.authDomain,
                projectId: CONFIG.projectId,
                storageBucket: CONFIG.storageBucket,
                messagingSenderId: CONFIG.messagingSenderId,
                appId: CONFIG.appId,
                measurementId: CONFIG.measurementId
            };

            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    const emailElem = document.getElementById('user-email');
                    const nameElem = document.getElementById('channel-name');
                    const logoElem = document.getElementById('channel-logo');

                    if (emailElem) emailElem.innerText = user.email || "Connected User";
                    if (nameElem && user.displayName) nameElem.innerText = user.displayName;
                    if (logoElem && user.photoURL) logoElem.src = user.photoURL;
                } else {
                    window.location.href = 'index.html';
                }
            });

            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    signOut(auth).then(() => {
                        localStorage.removeItem('agc_access_token');
                        window.location.href = 'index.html';
                    }).catch((error) => {
                        console.error("Logout Error:", error);
                    });
                });
            }

        } catch (err) {
            console.error("Firebase Setup Error:", err);
        }

        // Sidebar Toggle Logic
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const sidebar = document.getElementById('sidebar');

        if (menuToggleBtn && sidebar) {
            menuToggleBtn.addEventListener('click', () => {
                sidebar.classList.toggle('active');
            });
        }

        // Switch Channel Logic (Google account re-popup to switch/select different account or channel)
        const switchBtn = document.getElementById('switchChannelBtn');
        if (switchBtn) {
            switchBtn.addEventListener('click', async () => {
                try {
                    const provider = new GoogleAuthProvider();
                    provider.setCustomParameters({ prompt: 'select_account' });
                    const result = await signInWithPopup(auth, provider);
                    const credential = GoogleAuthProvider.credentialFromResult(result);
                    if (credential && credential.accessToken) {
                        localStorage.setItem('agc_access_token', credential.accessToken);
                        window.location.reload();
                    }
                } catch (error) {
                    console.error("Switch Channel Error:", error);
                }
            });
        }
    </script>
</body>
</html>
