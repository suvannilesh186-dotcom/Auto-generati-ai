    <!-- Firebase & Dashboard Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { CONFIG } from './config.js';

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: CONFIG.firebaseApiKey,
            authDomain: CONFIG.authDomain,
            projectId: CONFIG.projectId,
            storageBucket: CONFIG.storageBucket,
            messagingSenderId: CONFIG.messagingSenderId,
            appId: CONFIG.appId,
            measurementId: CONFIG.measurementId
        };

        // Initialize Firebase safely
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Check user login state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-email').innerText = user.email || "Connected User";
                if(user.displayName) {
                    document.getElementById('channel-name').innerText = user.displayName;
                }
                if(user.photoURL) {
                    document.getElementById('channel-logo').src = user.photoURL;
                }
            } else {
                window.location.href = 'index.html';
            }
        });

        // Sidebar Toggle Event Listener
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const sidebar = document.getElementById('sidebar');

        if (menuToggleBtn && sidebar) {
            menuToggleBtn.addEventListener('click', () => {
                sidebar.classList.toggle('active');
            });
        }

        // Switch Channel Functionality
        document.getElementById('switchChannelBtn').addEventListener('click', () => {
            alert("Switch channel option clicked.");
        });

        // Logout Functionality
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                localStorage.removeItem('agc_access_token');
                window.location.href = 'index.html';
            }).catch((error) => {
                alert("Logout Error: " + error.message);
            });
        });
    </script>
