<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGC.AI - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <!-- Top Header -->
    <header class="top-header">
        <button class="menu-toggle-btn" id="menuToggleBtn">☰</button>
        <div class="header-logo">AGC.AI Dashboard</div>
    </header>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="profile-box">
                <img id="channel-logo" src="https://via.placeholder.com/50" alt="Channel Logo" class="profile-logo">
                <div class="profile-info">
                    <h4 id="channel-name">Loading Channel...</h4>
                    <span id="user-email">user@gmail.com</span>
                </div>
            </div>

            <div class="sidebar-bottom">
                <button class="switch-channel-btn" id="switchChannelBtn">🔄 Switch Channel</button>
                <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <h1>Welcome to AGC.AI!</h1>
            <p>यहाँ आपका मुख्य डैशबोर्ड कंटेंट दिखाई देगा।</p>

            <!-- AI Chat Box Section -->
            <div class="ai-chat-section">
                <div class="chat-header">🤖 AGC.AI Assistant</div>
                <div class="chat-messages" id="chatMessages">
                    <div class="message ai-message">नमस्ते! मैं आपकी AI मदद के लिए तैयार हूँ। बताइए आज क्या करना है?</div>
                </div>
                <div class="chat-input-container">
                    <input type="text" id="chatInput" placeholder="यहाँ अपना मैसेज टाइप करें..." />
                    <button id="sendChatBtn">🚀 Send</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase & Dashboard Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { CONFIG } from './config.js';

        let auth;

        try {
            const firebaseConfig = {
                apiKey: CONFIG.firebaseApiKey,
                authDomain: CONFIG.authDomain,
                projectId: CONFIG.projectId,
                storageBucket: CONFIG.storageBucket,
                messagingSenderId: CONFIG.messagingSenderId,
                appId: CONFIG.appId,
                measurementId: CONFIG.measurementId
            };

            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    const emailElem = document.getElementById('user-email');
                    const nameElem = document.getElementById('channel-name');
                    const logoElem = document.getElementById('channel-logo');

                    if (emailElem) emailElem.innerText = user.email || "Connected User";
                    if (nameElem && user.displayName) nameElem.innerText = user.displayName;
                    if (logoElem && user.photoURL) logoElem.src = user.photoURL;
                } else {
                    window.location.href = 'index.html';
                }
            });

            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    signOut(auth).then(() => {
                        localStorage.removeItem('agc_access_token');
                        window.location.href = 'index.html';
                    }).catch((error) => {
                        console.error("Logout Error:", error);
                    });
                });
            }

        } catch (err) {
            console.error("Firebase Setup Error:", err);
        }

        // Sidebar Toggle Logic
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const sidebar = document.getElementById('sidebar');

        if (menuToggleBtn && sidebar) {
            menuToggleBtn.addEventListener('click', () => {
                sidebar.classList.toggle('active');
            });
        }

        // Switch Channel Logic
        const switchBtn = document.getElementById('switchChannelBtn');
        if (switchBtn) {
            switchBtn.addEventListener('click', async () => {
                try {
                    const provider = new GoogleAuthProvider();
                    provider.setCustomParameters({ prompt: 'select_account' });
                    
                    const result = await signInWithPopup(auth, provider);
                    const credential = GoogleAuthProvider.credentialFromResult(result);
                    if (credential && credential.accessToken) {
                        localStorage.setItem('agc_access_token', credential.accessToken);
                        window.location.reload();
                    }
                } catch (error) {
                    console.warn("Popup failed, trying redirect...", error);
                    try {
                        const provider = new GoogleAuthProvider();
                        provider.setCustomParameters({ prompt: 'select_account' });
                        await signInWithRedirect(auth, provider);
                    } catch (redirectError) {
                        console.error("Switch Channel Redirect Error:", redirectError);
                    }
                }
            });
        }

        // AI Chat Box Logic
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');

        if (sendChatBtn && chatInput) {
            const handleSendMessage = () => {
                const text = chatInput.value.trim();
                if (!text) return;

                const userMsg = document.createElement('div');
                userMsg.className = 'message user-message';
                userMsg.innerText = text;
                chatMessages.appendChild(userMsg);

                chatInput.value = '';
                chatMessages.scrollTop = chatMessages.scrollHeight;

                setTimeout(() => {
                    const aiMsg = document.createElement('div');
                    aiMsg.className = 'message ai-message';
                    aiMsg.innerText = "मैंने आपका सवाल सुन लिया है। जल्द ही इसे AI API से कनेक्ट किया जाएगा!";
                    chatMessages.appendChild(aiMsg);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }, 1000);
            };

            sendChatBtn.addEventListener('click', handleSendMessage);
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleSendMessage();
                }
            });
        }
    </script>
</body>
</html>
