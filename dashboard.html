    <!-- Firebase & Dashboard Logic Script -->
    <script type="module">
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const auth = getAuth();

        // Check user login state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-email').innerText = user.email || "Connected User";
                if(user.displayName) {
                    document.getElementById('channel-name').innerText = user.displayName;
                }
                if(user.photoURL) {
                    document.getElementById('channel-logo').src = user.photoURL;
                }
            } else {
                window.location.href = 'index.html';
            }
        });

        // Sidebar Toggle with Alert Test
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const sidebar = document.getElementById('sidebar');

        if (menuToggleBtn && sidebar) {
            menuToggleBtn.addEventListener('click', () => {
                alert("Hammer button clicked!"); // यह देखने के लिए कि क्लिक काम कर रहा है या नहीं
                sidebar.classList.toggle('active');
            });
        } else {
            console.error("Button or Sidebar not found!");
        }

        // Switch Channel Functionality
        document.getElementById('switchChannelBtn').addEventListener('click', () => {
            alert("Switch channel option clicked.");
        });

        // Logout Functionality
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                localStorage.removeItem('agc_access_token');
                window.location.href = 'index.html';
            }).catch((error) => {
                alert("Logout Error: " + error.message);
            });
        });
    </script>
