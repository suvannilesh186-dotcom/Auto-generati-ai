<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGC.AI - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 50px;">
    <div style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); display: inline-block;">
        <h1 style="color: #333;">Welcome to AGC.AI Dashboard!</h1>
        <p style="color: #666;">You have successfully logged in with your Google Account.</p>
        <button onclick="handleLogout()" style="padding: 10px 20px; background: #ff4d4d; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 20px;">Logout</button>
    </div>

    <script type="module">
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        window.handleLogout = function() {
            const auth = getAuth();
            signOut(auth).then(() => {
                localStorage.removeItem('agc_access_token');
                window.location.href = 'index.html';
            }).catch((error) => {
                alert("Logout Error: " + error.message);
            });
        }
    </script>
</body>
</html>
